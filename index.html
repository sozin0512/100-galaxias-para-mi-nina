<style>

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:'Cormorant Garamond',Georgia,serif;color:#fff}
  canvas{position:fixed;inset:0;display:block;outline:none}
  button{font-family:inherit}
  /* Intro / permiso de música */
  #intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;
    background:radial-gradient(ellipse at center,var(--bg) 0%,#050105 65%,#000 100%);transition:opacity 1.2s ease}
  #intro.fuera{opacity:0;pointer-events:none}
  .bokeh{position:absolute;bottom:-80px;filter:blur(6px);opacity:.45;animation:subir linear infinite;pointer-events:none}
  @keyframes subir{to{transform:translateY(-120vh) rotate(25deg)}}
  #introCorazon{width:min(30vw,120px);filter:drop-shadow(0 0 12px var(--c1)) drop-shadow(0 0 35px var(--c1));animation:latir 1.25s ease-in-out infinite;position:relative}
  @keyframes latir{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1.02)}36%{transform:scale(1.08)}}
  #introTexto{font-style:italic;font-size:clamp(1.4rem,5.5vw,2rem);text-shadow:0 0 12px var(--c1);position:relative;max-width:560px}
  #introPermiso{font-style:italic;font-size:clamp(1.05rem,4vw,1.3rem);opacity:.85;position:relative;max-width:480px;line-height:1.4}
  .btn{position:relative;border:1px solid rgba(255,255,255,.55);background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:clamp(1.15rem,4.5vw,1.4rem);
    font-weight:700;padding:14px 26px;border-radius:999px;cursor:pointer;box-shadow:0 0 18px var(--c1),0 0 40px rgba(255,255,255,.08);animation:respira 2.4s ease-in-out infinite}
  @keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  #sinMusica{position:relative;background:none;border:none;color:rgba(255,255,255,.55);font-style:italic;font-size:1rem;cursor:pointer;text-decoration:underline}
  #introNum{position:absolute;bottom:18px;left:0;right:0;font-size:.9rem;letter-spacing:.15em;opacity:.45}
  /* HUD */
  #titulo{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:5;pointer-events:none;padding:0 12px;
    font-weight:500;font-size:clamp(1.5rem,6vw,2.4rem);text-shadow:0 0 10px var(--c1),0 0 28px var(--c1);opacity:0;transition:opacity 2s ease 1s}
  #progreso{position:fixed;top:calc(max(16px,env(safe-area-inset-top)) + clamp(2.1rem,8vw,3.2rem));left:0;right:0;text-align:center;z-index:5;pointer-events:none;
    font-style:italic;font-size:1rem;opacity:0;transition:opacity 2s ease 1.5s;color:rgba(255,255,255,.75)}
  .ver{opacity:1!important}
  #codigo{position:fixed;top:calc(max(16px,env(safe-area-inset-top)) + clamp(2.1rem,8vw,3.2rem) + 1.5rem);left:0;right:0;text-align:center;z-index:5;font-size:.8rem;font-style:italic;pointer-events:none;letter-spacing:.05em;padding:0 10px;opacity:0;transition:opacity 2s ease 1.5s}
  #codigo.ver{opacity:.5!important}
  #nombreCard{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);z-index:22;width:min(90vw,520px);text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s ease,transform 1.6s ease}
  #nombreCard.ver{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #nombreCard .peq{font-style:italic;font-size:clamp(1rem,4vw,1.25rem);opacity:.85;letter-spacing:.06em}
  #nombreCard .gran{font-family:'Great Vibes',cursive;font-size:clamp(2.3rem,10vw,3.8rem);line-height:1.15;margin:8px 0;color:var(--c3);text-shadow:0 0 12px var(--c1),0 0 34px var(--c1)}
  #nombreCard .num{font-size:.95rem;letter-spacing:.2em;opacity:.7}
  /* Tarjeta pista / pregunta / mensajes */
  .panel{position:fixed;left:50%;bottom:calc(max(165px,env(safe-area-inset-bottom) + 155px));transform:translate(-50%,20px);z-index:20;width:min(92vw,460px);
    padding:18px 20px;border-radius:18px;text-align:center;background:rgba(10,3,14,.72);border:1px solid var(--c1);
    box-shadow:0 0 18px var(--c1),inset 0 0 18px rgba(255,255,255,.04);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .8s ease,transform .8s ease}
  .panel.ver{transform:translate(-50%,0);pointer-events:auto}
  .panel h3{font-family:'Great Vibes',cursive;font-weight:400;font-size:2rem;color:var(--c3);text-shadow:0 0 10px var(--c1);margin-bottom:6px}

  #pregunta{top:50%;bottom:auto;transform:translate(-50%,-46%);padding:30px 22px}
  #pregunta.ver{transform:translate(-50%,-50%)}

  .fila{display:flex;gap:16px;justify-content:center;align-items:center;min-height:70px}
  #btnSi{animation:none;transition:transform .3s}
  #btnNo{position:relative;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:1.15rem;padding:12px 24px;border-radius:999px;cursor:pointer;
    transition:left .25s ease,top .25s ease}
  #btnNo.huye{position:fixed;z-index:60}
  #btnPreguntar{position:fixed;left:50%;bottom:calc(max(165px,env(safe-area-inset-bottom) + 155px));transform:translateX(-50%);z-index:21;display:none}

  #reproductor{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:25;display:none;flex-direction:column;align-items:flex-end;gap:6px}
  #reproductor.ver{display:flex}
  #yt{width:200px;height:113px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.25);box-shadow:0 0 12px var(--c1);transition:opacity .4s}
  #reproductor.mini #yt{width:200px;height:113px;opacity:.35}
  #yt iframe{width:100%;height:100%;display:block}
  .controles{display:flex;gap:6px;align-items:center}
  .controles button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:15px;cursor:pointer}
  #cancion{font-size:.85rem;font-style:italic;opacity:.75;max-width:200px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #spotify{width:min(80vw,300px);height:80px;border:0;border-radius:12px;display:none}
  /* Carta */
  #modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .45s}
  #modal.abierto{opacity:1;pointer-events:auto}
  .caja{position:relative;max-width:440px;width:100%;max-height:80vh;overflow:auto;padding:34px 28px 28px;border-radius:18px;background:rgba(18,4,14,.85);border:1px solid var(--c1);box-shadow:0 0 18px var(--c1)}
  #cerrar{position:absolute;top:10px;right:14px;background:none;border:none;color:rgba(255,255,255,.7);font-size:26px;cursor:pointer}
  #carta h2{font-style:italic;font-weight:500;font-size:1.6rem;margin-bottom:14px;color:var(--c3)}
  #carta p{font-style:italic;font-size:1.15rem;line-height:1.55;margin-bottom:14px}
  #carta .firma{text-align:right;font-size:1.25rem;color:var(--c3)}
  @media (max-width:600px){ #yt,#reproductor.mini #yt{width:160px;height:90px} }
</style>
</head>

/* ---------- Animación ---------- */
const reloj = new THREE.Clock(false);

const sm = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };

  polvo.material.uniforms.uOpacity.value = 0.5 * (1 - m);

    const y = s.position.y; s.material.opacity = Math.min(1, (y + 10) / 4) * Math.min(1, (20 - y) / 5) * 0.8 * (1 - m * 0.5); }
  for (const s of frases) { s.position.y = s.userData.y0 + Math.sin(t * 0.8 + s.userData.f) * 0.35; s.material.opacity = 0.85 * (1 - m); }
  for (const s of clicables) { s.position.y = s.userData.y0 + Math.sin(t * 1.3 + s.userData.f) * 0.4; s.material.opacity = 1 - m; s.visible = m < 0.95;
    if (s.userData.sobre) { const k = 1 + Math.sin(t * 3 + s.userData.f) * 0.06; s.scale.set(2.4 * k, 1.875 * k, 1); } }

  for (let i = fugaces.length - 1; i >= 0; i--) { const l = fugaces[i], u = l.userData; u.vida += dt;
    if (u.vida > u.max) { scene.remove(l); l.geometry.dispose(); fugaces.splice(i, 1); continue; }
    const h = u.p.clone().addScaledVector(u.d, u.vida), tl = h.clone().addScaledVector(u.d, -0.18);
    l.geometry.attributes.position.array.set([h.x, h.y, h.z, tl.x, tl.y, tl.z]); l.geometry.attributes.position.needsUpdate = true;
    l.material.opacity = Math.sin(u.vida / u.max * Math.PI); }

    if (u.vida > u.max) { scene.remove(s); s.material.dispose(); rafagas.splice(i, 1); continue; }
    u.v.multiplyScalar(1 - dt * 1.5); u.v.y += dt * 1.2; s.position.addScaledVector(u.v, dt); const k = u.vida / u.max; s.material.opacity = 1 - k * k; }
  if (!camLibre) camPath(t); else controls.update();
  composer.render();
}
