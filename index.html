  $('titulo').classList.add('ver'); $('progreso').classList.add('ver'); $('codigo').classList.add('ver');
  setTimeout(() => $('nombreCard').classList.add('ver'), 900); setTimeout(() => $('nombreCard').classList.remove('ver'), 5600);
  reloj.start(); animar(); CON?.empezar();
  if (bloqueada) { $('avisoTexto').textContent = `Primero encuentre la galaxia #${progreso + 1} 💫 Esta la espera un poquito más adelante.`;
    if (QUIZ && CONFIG.clave99) {
      $('avisoTexto').textContent = 'Las galaxias se encuentran en orden 💫 Primero tiene que encontrar las anteriores, una por una.';
      $('claveCaja').style.display = 'block';
      const probar = () => { if ($('claveInput').value.trim() === String(CONFIG.clave99)) {
          bloqueada = false; try { localStorage.setItem(KEY, String(TOTAL - 1)); } catch (e) {}
          $('aviso').classList.remove('ver'); $('aviso').style.opacity = 0; $('aviso').style.pointerEvents = 'none'; setTimeout(mostrarQuiz, 600);
        } else { $('claveError').textContent = 'Clave incorrecta 🙈'; } };
      $('claveBtn').onclick = probar; $('claveInput').onkeydown = e => { if (e.key === 'Enter') probar(); };
    }
    setTimeout(() => { $('aviso').classList.add('ver'); $('aviso').style.opacity = 1; }, 2500); return; }
  if (FINAL) setTimeout(() => { $('btnPreguntar').classList.add('ver'); }, CONFIG.segundosParaPregunta * 1000);
  else if (QUIZ) setTimeout(mostrarQuiz, 7000);
  else if (CANSADA) setTimeout(mostrarCansada, 7000);
  else setTimeout(mostrarPista, 7000);
}
$('btnMusica').onclick = e => { e.stopPropagation(); entrar(true); };
$('sinMusica').onclick = e => { e.stopPropagation(); entrar(false); };

/* ---------- La pregunta (solo en la última galaxia) ---------- */
let nNo = 0, dijoSi = false, tSi = 0;
$('btnPreguntar').onclick = () => { $('btnPreguntar').classList.remove('ver'); $('preguntaTexto').textContent = conNombre(CONFIG.pregunta); $('preguntaPara').textContent = CONFIG.nombreCompleto ? `Para ${CONFIG.nombreCompleto}` : '';
  $('pregunta').classList.add('ver'); $('pregunta').style.opacity = 1; };
function huir(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const b = $('btnNo'); b.classList.add('huye'); document.body.appendChild(b);
  const w = b.offsetWidth, h = b.offsetHeight;
  b.style.left = mr(10, innerWidth - w - 10) + 'px'; b.style.top = mr(10, innerHeight - h - 10) + 'px';
  b.textContent = CONFIG.textosNo[nNo++ % CONFIG.textosNo.length];
  $('btnSi').style.transform = `scale(${Math.min(1.9, 1 + nNo * 0.12)})`;
}
['pointerenter', 'pointerdown', 'touchstart', 'click'].forEach(ev => $('btnNo').addEventListener(ev, huir, { passive: false }));
$('btnSi').onclick = () => {
  if (dijoSi) return; dijoSi = true; tSi = reloj.elapsedTime;
  $('pregunta').classList.remove('ver'); $('pregunta').style.opacity = 0; $('btnNo').style.display = 'none';
  $('titulo').textContent = CONFIG.mensajeSi;
  for (let i = 0; i < 6; i++) setTimeout(() => explosion(new THREE.Vector3(mr(-15, 15), mr(-5, 15), mr(-15, 15)), 26, 1.4), i * 450);
  setTimeout(() => { $('finalTitulo').textContent = '💖'; $('finalTexto').textContent = CONFIG.detalleSi + (CONFIG.de ? ` — ${CONFIG.de}` : '');
    if (CONFIG.whatsapp) { $('waLink').href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(CONFIG.whatsappTexto || 'Sí quiero 💖')}`; $('finalWa').style.display = 'block'; }
    $('final').classList.add('ver'); $('final').style.opacity = 1; }, 3500);
};

/* ---------- Animación ---------- */
const reloj = new THREE.Clock(false);
const latido = t => { const p = (t % 1.25) / 1.25; return Math.exp(-(((p - 0.08) / 0.045) ** 2)) * 0.08 + Math.exp(-(((p - 0.28) / 0.055) ** 2)) * 0.05; };
const sm = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
let siguienteFugaz = 2;
function ciclo(t) { // modo "explota y forma un corazón": forma → explota → corazón → explota → forma
  const p = t % 20;
  if (p < 8) return [0, 0];
  if (p < 9.5) return [sm(8, 9.5, p), 0];
  if (p < 11.5) return [1 - sm(9.5, 11.5, p), sm(9.5, 11.5, p)];
  if (p < 15) return [0, 1];
  if (p < 16.5) return [sm(15, 16.5, p), 1 - sm(15, 16.5, p)];
  return [1 - sm(16.5, 20, p), 0];
}
function animar() {
  requestAnimationFrame(animar);
  const dt = Math.min(reloj.getDelta(), 0.05), t = reloj.elapsedTime;
  U.uTime.value = t; const lat = latido(t); U.uPulse.value = lat * 1.2;
  if (FORMA.v) galaxia.rotation.y = Math.sin(t * Math.abs(VEL) * 3) * 0.6; else galaxia.rotation.y += dt * VEL;
  let [b, m] = MI === 3 ? ciclo(t) : [0, 0];
  if (dijoSi) { const k = sm(0, 3, t - tSi); m = Math.max(m, k); b = b * (1 - k); }
  U.uBurst.value = b; U.uMorph.value = m;
  if (corazon) { corazon.scale.setScalar(1 + lat * 1.3); corazon.rotation.y = Math.sin(t * 0.5) * 0.3; corazon.material.uniforms.uOpacity.value = 0.75 * (1 - m); }
  polvo.material.uniforms.uOpacity.value = 0.5 * (1 - m);
  bloom.strength = (BLOOM * 0.8 + lat * 0.8 + m * 0.3) * (CON ? 1 - 0.55 * CON.op() : 1);
  for (const s of subiendo) { s.position.y += s.userData.v * dt; s.position.x += Math.sin(t + s.userData.f) * dt * 0.3; if (s.position.y > 20) s.position.y = -10;
    const y = s.position.y; s.material.opacity = Math.min(1, (y + 10) / 4) * Math.min(1, (20 - y) / 5) * 0.8 * (1 - m * 0.5); }
  for (const s of frases) { s.position.y = s.userData.y0 + Math.sin(t * 0.8 + s.userData.f) * 0.35; s.material.opacity = 0.6 * (1 - m) * (CON ? 1 - CON.k() : 1); s.visible = s.material.opacity > 0.01; }
  for (const s of clicables) { s.position.y = s.userData.y0 + Math.sin(t * 1.3 + s.userData.f) * 0.4; s.material.opacity = 1 - m; s.visible = m < 0.95;
    if (s.userData.sobre) { const k = 1 + Math.sin(t * 3 + s.userData.f) * 0.06; s.scale.set(2.4 * k, 1.875 * k, 1); } }
  if (FUGACES && t > siguienteFugaz) { lanzarFugaz(); siguienteFugaz = t + mr(0.3, 2) / FUGACES; }
  for (let i = fugaces.length - 1; i >= 0; i--) { const l = fugaces[i], u = l.userData; u.vida += dt;
    if (u.vida > u.max) { scene.remove(l); l.geometry.dispose(); fugaces.splice(i, 1); continue; }
    const h = u.p.clone().addScaledVector(u.d, u.vida), tl = h.clone().addScaledVector(u.d, -0.18);
    l.geometry.attributes.position.array.set([h.x, h.y, h.z, tl.x, tl.y, tl.z]); l.geometry.attributes.position.needsUpdate = true;
    l.material.opacity = Math.sin(u.vida / u.max * Math.PI); }
  for (let i = rafagas.length - 1; i >= 0; i--) { const s = rafagas[i], u = s.userData; u.vida += dt;
    if (u.vida > u.max) { scene.remove(s); s.material.dispose(); rafagas.splice(i, 1); continue; }
    u.v.multiplyScalar(1 - dt * 1.5); u.v.y += dt * 1.2; s.position.addScaledVector(u.v, dt); const k = u.vida / u.max; s.material.opacity = 1 - k * k; }
  if (!camLibre) camPath(t); else controls.update();
  CON?.paso(dt, t);
  composer.render();
}
// Para capturas automáticas: ?captura=1&t=SEG salta la intro
if (qs.has('captura')) window.__entrar = () => entrar(false);

addEventListener('resize', () => { camera.aspect = aspecto(); camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight); U.uScale.value = innerHeight * renderer.getPixelRatio() / 2; heartFit(); });

</script>
